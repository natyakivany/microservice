server: 
  port: 9000

spring:
  application:
    name: gateway_service
  cloud:
    gateway:
      routes: 
        - id: PRODUK
          uri: lb://PRODUK
          predicates:
            - Path=/api/produk/** 
          uri: lb://ORDER
          predicates:
            - Path=/api/orders/** 

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl: 
      defaultZone: http://localhost:8761/eureka/ 
  instance:
    hostname: localhost